# fly deploy --config infra/fly.toml --dockerfile infra/Dockerfile
app = "annotation-service"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  ANNOTATION_ARTIFACTS = "/app/artifacts"
  HF_HOME = "/opt/hf"
  HF_HUB_OFFLINE = "1"

[http_service]
  internal_port = 8600
  force_https = true
  # No scale-to-zero: a cold start loads MiniLM and a 10,003 x 384 index, then warms.
  # That is ~20 seconds, and paying it on a user's request in front of a 5ms endpoint
  # would be absurd.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # p50 is 5ms, so one machine absorbs a great deal. The soft limit leaves headroom for
  # the tail rather than being set at the mean.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 120

  [[http_service.checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "45s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  # MiniLM plus the index plus torch's allocator sit around 900MB resident.
  memory_mb = 1024

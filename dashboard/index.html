<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotation Service</title>
<!--
  Type a banking question, watch it classify or abstain.

  The interactive core is the live classifier plus the threshold slider. Moving the
  threshold shows the coverage/precision trade directly: raise it and more items route to
  a human, and the auto-accepted ones get more accurate. That trade is the actual
  business decision, and a slider makes it concrete in a way the table does not.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<style>
  :root{
    --bg:#0c0f14; --panel:#151a22; --panel2:#1d242e; --line:#2a333f;
    --text:#e8edf3; --dim:#8c98a7; --accent:#5ac8a8;
    --ok:#3fb56f; --warn:#d8a13a; --bad:#e0574f;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 16px 70px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:21px;margin:0;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px}
  .pill{font:600 11px var(--mono);padding:3px 8px;border-radius:999px;
        border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
  .pill.ok{color:var(--ok);border-color:#1c4632}
  .grid{display:grid;gap:14px;margin-top:16px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .two{grid-template-columns:1.15fr 1fr}
  @media(max-width:900px){.two{grid-template-columns:1fr}}
  .card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .card{padding:12px 14px}
  .card .label{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .card .value{font:600 21px/1.2 var(--mono);margin-top:5px;letter-spacing:-.02em}
  .card .foot{color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:2px}
  .panel{overflow:hidden}
  .panel h2{font-size:12px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);
            color:var(--dim);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
  .pad{padding:14px}
  textarea{width:100%;min-height:74px;resize:vertical;font:14px inherit;padding:11px;
    border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
  button{font:600 12px/1 inherit;padding:9px 14px;border-radius:7px;cursor:pointer;
         border:1px solid var(--line);background:var(--panel2);color:var(--text)}
  button:hover:not(:disabled){border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06231c}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .verdict{font:700 22px/1.25 -apple-system,system-ui;letter-spacing:-.02em;margin-top:2px}
  .v-accept{color:var(--ok)} .v-abstain{color:var(--warn)}
  .reason{color:#c2ccd8;font-size:13px;margin-top:6px}
  .bars{margin-top:12px}
  .bar{display:grid;grid-template-columns:190px 1fr 52px;gap:9px;align-items:center;
       margin-bottom:5px;font:11px var(--mono)}
  .bar .track{height:8px;background:#202833;border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent);border-radius:4px}
  .bar span:last-child{text-align:right;color:var(--dim)}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
  th{background:var(--panel2);color:var(--dim);text-align:right;padding:7px 10px;
     font-size:11px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:6px 10px;border-bottom:1px solid #1b222c;text-align:right}
  tr.win td{background:rgba(63,181,111,.09)}
  tr.dead td{color:#6c7683}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .note{color:var(--dim);font-size:12.5px;padding:0 14px 14px;line-height:1.55;max-width:80ch}
  .nb{font:11px var(--mono);color:var(--dim);padding:4px 0;border-bottom:1px solid #1b222c}
  code{font-family:var(--mono);background:var(--panel2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback} = React;
const j = u => fetch(u).then(r=>r.ok?r.json():Promise.reject(r.status));
const post = (u,b) => fetch(u,{method:"POST",headers:{"content-type":"application/json"},
  body:JSON.stringify(b)}).then(r=>r.json());

const SAMPLES = [
  "My card still has not arrived after two weeks",
  "Why was I charged an extra fee on my statement?",
  "How do I top up my account?",
  "I need to reset my PIN",
  "asdfgh qwerty zxcvb",
];

function Alternatives({alts}){
  if(!alts?.length) return null;
  const max = Math.max(...alts.map(a=>a.confidence)) || 1;
  return <div className="bars">{alts.map(a=>
    <div className="bar" key={a.label}>
      <span>{a.label}</span>
      <div className="track"><div className="fill"
        style={{width:(a.confidence/max*100).toFixed(1)+"%"}}/></div>
      <span>{(a.confidence*100).toFixed(1)}%</span>
    </div>)}</div>;
}

function App(){
  const [text,setText]=useState(SAMPLES[0]);
  const [res,setRes]=useState(null);
  const [busy,setBusy]=useState(false);
  const [summary,setSummary]=useState(null);
  const [metrics,setMetrics]=useState(null);
  const [threshold,setThreshold]=useState(null);

  useEffect(()=>{ j("/results").then(r=>{ setSummary(r);
    setThreshold(r.abstention.chosen.threshold); }).catch(()=>{});
    j("/metrics").then(setMetrics).catch(()=>{}); },[]);

  const classify = useCallback(async(t)=>{
    setBusy(true);
    try{ setRes(await post("/classify",{text:t,top_k:5,explain:true})); }
    finally{ setBusy(false); j("/metrics").then(setMetrics).catch(()=>{}); }
  },[]);

  useEffect(()=>{ classify(SAMPLES[0]); },[classify]);

  // The threshold slider is applied client-side against the live confidence, so moving
  // it re-decides the CURRENT prediction instantly without a round trip.
  const abstain = res && threshold!=null ? res.confidence < threshold : res?.abstain;
  const curve = summary?.abstention?.operating_curve || [];
  const atThreshold = threshold!=null
    ? curve.reduce((best,r)=> Math.abs(r.threshold-threshold) < Math.abs(best.threshold-threshold) ? r : best,
                   curve[0]||{coverage:0,precision:0})
    : null;

  return <div className="wrap">
    <header>
      <h1>Annotation Service</h1>
      <span className="sub">BANKING77 · 77 intents · does the LLM earn its place?</span>
      {metrics && <span className="pill ok">{metrics.health.ready?"ready":"not ready"}</span>}
      {metrics && <span className="pill">{metrics.service.index_size.toLocaleString()} indexed</span>}
      {metrics && <span className="pill">p50 {metrics.service.p50_ms}ms</span>}
    </header>

    {summary && <div className="grid cards">
      <div className="card"><div className="label">Retriever</div>
        <div className="value">{(summary.retrieval.top1_accuracy*100).toFixed(1)}%</div>
        <div className="foot">no LLM at all</div></div>
      <div className="card"><div className="label">LLM only</div>
        <div className="value" style={{color:"var(--bad)"}}>
          {(summary.ablation.arms[1].accuracy*100).toFixed(1)}%</div>
        <div className="foot">{summary.ablation.arms[1].lm_calls.toLocaleString()} forward passes</div></div>
      <div className="card"><div className="label">Fusion α</div>
        <div className="value">{summary.ablation.alpha_sweep.best.alpha}</div>
        <div className="foot">1.0 = all retriever</div></div>
      <div className="card"><div className="label">ECE</div>
        <div className="value">{summary.calibration.ece_after}</div>
        <div className="foot">from {summary.calibration.ece_before}</div></div>
      <div className="card"><div className="label">Auto-accepted</div>
        <div className="value">{(summary.abstention.chosen.coverage*100).toFixed(0)}%</div>
        <div className="foot">at {(summary.abstention.chosen.precision*100).toFixed(1)}% precision</div></div>
      <div className="card"><div className="label">Cost / 1k</div>
        <div className="value">${summary.cost.options[0].total_cost_per_1k.toFixed(4)}</div>
        <div className="foot">vs ${summary.cost.human_cost_per_1k.toFixed(2)} human</div></div>
    </div>}

    <div className="grid two">
      <div className="panel">
        <h2>Classify a message</h2>
        <div className="pad">
          <textarea value={text} onChange={e=>setText(e.target.value)}/>
          <div className="btnrow">
            <button className="primary" disabled={busy} onClick={()=>classify(text)}>
              {busy?"classifying…":"Classify"}</button>
            {SAMPLES.map((s,i)=>
              <button key={i} onClick={()=>{setText(s); classify(s);}}
                style={{fontWeight:400}}>{i===SAMPLES.length-1?"gibberish":"sample "+(i+1)}</button>)}
          </div>

          {res && <>
            <div className={"verdict "+(abstain?"v-abstain":"v-accept")}
                 style={{marginTop:16}}>
              {abstain ? "ABSTAIN → human review" : res.prediction}</div>
            <div className="reason">
              confidence {(res.confidence*100).toFixed(1)}% against a
              {" "}{((threshold??res.threshold)*100).toFixed(1)}% threshold
              {" · "}{res.timing_ms.total.toFixed(1)}ms
              ({res.timing_ms.embed.toFixed(1)} embed + {res.timing_ms.search.toFixed(1)} search)
            </div>
            <Alternatives alts={res.alternatives}/>

            {res.neighbours && <div style={{marginTop:14}}>
              <div style={{color:"var(--dim)",fontSize:11,textTransform:"uppercase",
                           letterSpacing:".06em",marginBottom:6}}>
                nearest training messages — this IS the explanation</div>
              {res.neighbours.map((n,i)=>
                <div className="nb" key={i}>{n.similarity.toFixed(3)} · {n.label} · "{n.text}"</div>)}
            </div>}
          </>}
        </div>
      </div>

      <div>
        <div className="panel" style={{marginBottom:14}}>
          <h2>Abstention threshold — move it</h2>
          <div className="pad">
            {threshold!=null && <>
              <input type="range" min="0" max="1" step="0.01" value={threshold}
                     onChange={e=>setThreshold(+e.target.value)}/>
              <div style={{font:"12px var(--mono)",color:"var(--dim)",marginTop:6}}>
                threshold {threshold.toFixed(2)}
                {atThreshold && <> · coverage {(atThreshold.coverage*100).toFixed(0)}%
                  · precision {(atThreshold.precision*100).toFixed(1)}%</>}
              </div>
              <button style={{marginTop:10}}
                onClick={()=>setThreshold(summary.abstention.chosen.threshold)}>
                reset to the derived threshold</button>
            </>}
          </div>
          <div className="note">
            The default was <b>derived</b>, not chosen: the lowest threshold achieving
            95% precision on held-out data, which maximises coverage subject to that
            guarantee. Raise it and more work goes to people; lower it and more errors ship.
          </div>
        </div>

        {summary && <div className="panel">
          <h2>Four-arm ablation</h2>
          <div className="pad"><table>
            <thead><tr><th>arm</th><th>accuracy</th><th>LM calls</th></tr></thead>
            <tbody>{summary.ablation.arms.map(a=>
              <tr key={a.arm} className={a.arm==="A"?"win":""}>
                <td>{a.arm} · {a.description.split("(")[0].trim()}</td>
                <td>{(a.accuracy*100).toFixed(2)}%{a.evaluated_on_full_test_set?"":"*"}</td>
                <td>{a.lm_calls.toLocaleString()}</td></tr>)}
            </tbody></table></div>
          <div className="note">* arm D is scored on a subset; its prompts are ~3× longer.
            The retriever alone wins, and the fusion sweep puts <b>zero</b> weight on the
            language model.</div>
        </div>}
      </div>
    </div>

    {summary && <div className="panel" style={{marginTop:14}}>
      <h2>Cost frontier — pay humans, or automate?</h2>
      <div className="pad"><table>
        <thead><tr><th>option</th><th>$/1k items</th><th>accuracy</th>
          <th>coverage</th><th>effective</th><th>status</th></tr></thead>
        <tbody>{summary.cost.options.map(o=>{
          const dominated = summary.cost.dominated.includes(o.name);
          return <tr key={o.name} className={dominated?"dead":""}>
            <td>{o.name}</td>
            <td>{o.total_cost_per_1k < 1 ? "$"+o.total_cost_per_1k.toFixed(4)
                                        : "$"+o.total_cost_per_1k.toFixed(2)}</td>
            <td>{(o.accuracy*100).toFixed(2)}%</td>
            <td>{(o.coverage*100).toFixed(0)}%</td>
            <td>{(o.effective_accuracy*100).toFixed(2)}%</td>
            <td>{dominated?"dominated":"on the frontier"}</td></tr>;})}
        </tbody></table></div>
      <div className="note">
        Only three options are live: the retriever at a fraction of a cent, the gated
        version that buys precision back with human review, and pure human annotation.
        Everything else is beaten on <i>both</i> cost and quality — including the LLM
        re-rank, which costs 40× more than the retriever and adds nothing.
      </div>
    </div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

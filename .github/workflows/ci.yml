name: annotation-ci

# Each job defends a claim.
#   logic     fusion, calibration, abstention and cost maths - no models, no downloads
#   pipeline  the real dataset, the real ablation, and the findings the README states
#   serving   the API serves what the pipeline derived, and abstains when it should

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install numpy pytest scikit-learn
      - name: Pipeline logic tests
        # No torch, no transformers, no network. The maths must stand on its own.
        run: python -m pytest tests/test_pipeline_logic.py -q

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-flant5-base-v1

      - run: python data/fetch.py
      - name: Run the pipeline (reduced test set)
        run: python -m src.report --test-size 400 --few-shot-subset 100

      - name: The findings must still hold
        run: |
          python - <<'PY'
          import json
          r = json.load(open("outputs/results.json"))
          arms = {a["arm"]: a["accuracy"] for a in r["ablation"]["arms"]}
          print(json.dumps({"arms": arms,
                            "alpha": r["ablation"]["alpha_sweep"]["best"]["alpha"],
                            "ece": [r["calibration"]["ece_before"],
                                    r["calibration"]["ece_after"]],
                            "gate": r["abstention"]["chosen"]["coverage"]}, indent=2))

          # THE HEADLINE. The retriever beats the language model, and by a wide margin.
          # If this ever inverts, the serving path is wrong and the README is wrong.
          assert arms["A"] > arms["B"] + 0.15, \
              f"the LM ({arms['B']}) closed the gap on the retriever ({arms['A']})"

          # THE CLAIM IS THAT THE LM ADDS NOTHING - not that the argmax lands on a
          # particular alpha. Those are different assertions, and only the first is
          # robust: at 400 test rows alpha 0.7 and alpha 1.0 tied at exactly 0.9100,
          # and max() returning the first one made a gate on "alpha >= 0.9" fail on a
          # run where the LM contributed literally zero.
          sweep = r["ablation"]["alpha_sweep"]
          gain = sweep["gain_of_best_mixture_over_retriever_alone"]
          print(f"best alpha {sweep['best']['alpha']}, "
                f"gain of the best mixture over discarding the LM: {gain:+.4f}")
          assert gain <= 0.01, \
              f"the best mixture now beats the retriever alone by {gain:+.4f} - the LM " \
              f"may be earning its place, which would invert the project's finding"

          # The shortlist ceiling bounds everything downstream.
          assert r["retrieval"]["ceiling"]["recall_at_8"] > 0.95

          # Calibration must actually calibrate.
          assert r["calibration"]["ece_after"] < r["calibration"]["ece_before"]
          assert r["calibration"]["ece_reduction_pct"] > 40

          # The gate must hit its target while still automating most traffic; a gate
          # that sends everything to humans meets any precision target and is useless.
          gate = r["abstention"]["chosen"]
          assert gate["target_achieved"] and gate["coverage"] > 0.6

          # The student must retain most of the teacher.
          best = max(r["distillation"]["neural_student"]["student_accuracy"],
                     r["distillation"]["linear_student"]["student_accuracy"])
          assert best / r["distillation"]["teacher_accuracy"] > 0.93

          # The LM must be dominated on the cost frontier.
          assert "LM only" in r["cost"]["dominated"]
          print("all findings hold")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/index.npz
            artifacts/serving.json
            outputs/results.json

  encoder:
    # The deployed image ships MiniLM as a TorchScript graph and drops `transformers`
    # entirely, because measurement put that import at 215 MB on a 512 MB instance -
    # more than the model. That is only safe if the traced graph is the same function.
    # A drifted encoder would change every prediction while every other test still
    # passed, so this job re-derives it and compares against the real model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: hf-minilm-flant5-base-v1}
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers tokenizers numpy
      - run: python tools/export_encoder.py
      - name: The traced encoder must be the same function as the checkpoint
        run: |
          python - <<'PY'
          import pathlib, numpy as np
          from serve.light_embedder import TracedEmbedder
          from src.retriever import Embedder

          texts = ["my card has not arrived", "how do I top up my account?",
                   "I need to reset my pin", "why was I charged a fee",
                   "asdfgh qwerty zxcvb", "the atm ate my card",
                   "a much longer message about a transfer that has not arrived yet "
                   "and which I would like someone to look into"]
          traced = TracedEmbedder(pathlib.Path("artifacts"))
          full = Embedder(traced.name)
          diff = float(np.abs(traced.encode(texts) - full.encode(texts)).max())
          print(f"max embedding difference: {diff:.3e}")
          assert diff < 1e-5, f"the traced encoder drifted by {diff:.3e}"

          # Batching must not change the answer either: the corpus is embedded in
          # batches of 128 padded to the longest member, and if padding leaked into
          # the pooled vector the index would differ from the query encoder.
          one = traced.encode(texts)
          traced.batch_size = 2
          many = traced.encode(texts)
          batched = float(np.abs(one - many).max())
          print(f"max difference across batch sizes: {batched:.3e}")
          # Observed 1.3e-07 locally - float32 accumulation order, not padding. A real
          # leak shows up two or more orders of magnitude above this.
          assert batched < 1e-5, "padding leaks into the pooled embedding"
          print("the traced encoder is the checkpoint")
          PY

  serving:
    runs-on: ubuntu-latest
    needs: [pipeline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/download-artifact@v4
        with: {name: model-artifacts, path: .}
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: hf-minilm-flant5-base-v1}

      - run: python -m pytest tests/ -q

      - name: The service must serve the derived threshold and abstain on noise
        run: |
          python -m uvicorn serve.app:app --host 127.0.0.1 --port 8600 &
          for i in $(seq 1 60); do
            curl -sf localhost:8600/health/ready >/dev/null && break; sleep 2; done
          python - <<'PY'
          import json, urllib.request
          def post(path, body):
              req = urllib.request.Request(
                  f"http://127.0.0.1:8600{path}", method="POST",
                  data=json.dumps(body).encode(),
                  headers={"content-type": "application/json"})
              return json.load(urllib.request.urlopen(req))

          config = json.load(open("artifacts/serving.json"))
          clear = post("/classify", {"text": "My card still has not arrived"})
          noise = post("/classify", {"text": "asdfgh qwerty zxcvb"})
          print(json.dumps({"clear": [clear["prediction"], clear["confidence"],
                                      clear["abstain"]],
                            "noise": [noise["prediction"], noise["confidence"],
                                      noise["abstain"]]}, indent=2))

          # The threshold must come from the pipeline, not from a constant in the service.
          assert abs(clear["threshold"] - config["abstain_threshold"]) < 1e-4
          # A clear message is answered; noise is refused. Both directions matter - a gate
          # that abstains on everything is as broken as one that abstains on nothing.
          assert not clear["abstain"], "a clear message was sent to human review"
          assert noise["abstain"], "gibberish was confidently labelled"
          print("serving contract holds")
          PY

name: annotation-ci

# Each job defends a claim.
#   logic     fusion, calibration, abstention and cost maths - no models, no downloads
#   pipeline  the real dataset, the real ablation, and the findings the README states
#   serving   the API serves what the pipeline derived, and abstains when it should

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install numpy pytest scikit-learn
      - name: Pipeline logic tests
        # No torch, no transformers, no network. The maths must stand on its own.
        run: python -m pytest tests/test_pipeline_logic.py -q

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-flant5-base-v1

      - run: python data/fetch.py
      - name: Run the pipeline (reduced test set)
        run: python -m src.report --test-size 400 --few-shot-subset 100

      - name: The findings must still hold
        run: |
          python - <<'PY'
          import json
          r = json.load(open("outputs/results.json"))
          arms = {a["arm"]: a["accuracy"] for a in r["ablation"]["arms"]}
          print(json.dumps({"arms": arms,
                            "alpha": r["ablation"]["alpha_sweep"]["best"]["alpha"],
                            "ece": [r["calibration"]["ece_before"],
                                    r["calibration"]["ece_after"]],
                            "gate": r["abstention"]["chosen"]["coverage"]}, indent=2))

          # THE HEADLINE. The retriever beats the language model, and by a wide margin.
          # If this ever inverts, the serving path is wrong and the README is wrong.
          assert arms["A"] > arms["B"] + 0.15, \
              f"the LM ({arms['B']}) closed the gap on the retriever ({arms['A']})"

          # Fusion puts (almost) all weight on the retriever - the LM adds nothing.
          assert r["ablation"]["alpha_sweep"]["best"]["alpha"] >= 0.9

          # The shortlist ceiling bounds everything downstream.
          assert r["retrieval"]["ceiling"]["recall_at_8"] > 0.95

          # Calibration must actually calibrate.
          assert r["calibration"]["ece_after"] < r["calibration"]["ece_before"]
          assert r["calibration"]["ece_reduction_pct"] > 40

          # The gate must hit its target while still automating most traffic; a gate
          # that sends everything to humans meets any precision target and is useless.
          gate = r["abstention"]["chosen"]
          assert gate["target_achieved"] and gate["coverage"] > 0.6

          # The student must retain most of the teacher.
          best = max(r["distillation"]["neural_student"]["student_accuracy"],
                     r["distillation"]["linear_student"]["student_accuracy"])
          assert best / r["distillation"]["teacher_accuracy"] > 0.93

          # The LM must be dominated on the cost frontier.
          assert "LM only" in r["cost"]["dominated"]
          print("all findings hold")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/index.npz
            artifacts/serving.json
            outputs/results.json

  serving:
    runs-on: ubuntu-latest
    needs: [pipeline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/download-artifact@v4
        with: {name: model-artifacts, path: .}
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: hf-minilm-flant5-base-v1}

      - run: python -m pytest tests/ -q

      - name: The service must serve the derived threshold and abstain on noise
        run: |
          python -m uvicorn serve.app:app --host 127.0.0.1 --port 8600 &
          for i in $(seq 1 60); do
            curl -sf localhost:8600/health/ready >/dev/null && break; sleep 2; done
          python - <<'PY'
          import json, urllib.request
          def post(path, body):
              req = urllib.request.Request(
                  f"http://127.0.0.1:8600{path}", method="POST",
                  data=json.dumps(body).encode(),
                  headers={"content-type": "application/json"})
              return json.load(urllib.request.urlopen(req))

          config = json.load(open("artifacts/serving.json"))
          clear = post("/classify", {"text": "My card still has not arrived"})
          noise = post("/classify", {"text": "asdfgh qwerty zxcvb"})
          print(json.dumps({"clear": [clear["prediction"], clear["confidence"],
                                      clear["abstain"]],
                            "noise": [noise["prediction"], noise["confidence"],
                                      noise["abstain"]]}, indent=2))

          # The threshold must come from the pipeline, not from a constant in the service.
          assert abs(clear["threshold"] - config["abstain_threshold"]) < 1e-4
          # A clear message is answered; noise is refused. Both directions matter - a gate
          # that abstains on everything is as broken as one that abstains on nothing.
          assert not clear["abstain"], "a clear message was sent to human review"
          assert noise["abstain"], "gibberish was confidently labelled"
          print("serving contract holds")
          PY
